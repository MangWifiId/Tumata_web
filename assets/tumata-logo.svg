<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="tumataGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>
  <!-- Icon: Wedding camera with intertwined rings / lens -->
  <g transform="translate(15, 15)">
    <!-- Camera Body -->
    <rect x="10" y="30" width="90" height="65" rx="14" fill="url(#tumataGreen)" />
    <!-- Flash / Viewfinder bump -->
    <path d="M 40 30 L 45 18 L 65 18 L 70 30 Z" fill="#047857" />
    <circle cx="85" cy="42" r="5" fill="#a7f3d0" />
    
    <!-- Outer Lens / Ring 1 -->
    <circle cx="55" cy="62" r="26" fill="none" stroke="#ffffff" stroke-width="5" />
    <!-- Inner Lens / Ring 2 Intertwined -->
    <circle cx="55" cy="62" r="16" fill="none" stroke="#a7f3d0" stroke-width="3.5" />
    <circle cx="55" cy="62" r="7" fill="#ffffff" />
    
    <!-- Wedding Sparkle Accent -->
    <path d="M 96 16 Q 99 24 107 27 Q 99 30 96 38 Q 93 30 85 27 Q 93 24 96 16 Z" fill="#10b981" />
  </g>

  <!-- Typography -->
  <text x="145" y="72" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="48" font-weight="700" letter-spacing="6" fill="#064e3b">TUMATA</text>
  <text x="148" y="98" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="4.5" fill="#059669">WEDDING STUDIO MANAGEMENT</text>
  <line x1="148" y1="108" x2="445" y2="108" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
