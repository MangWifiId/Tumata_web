# Hostless Cloud deployment configuration
# Build Go backend + React frontend inside a Docker multi-stage build.
# Docs: https://docs.hostless.cloud/app/hostlessfile

build:
  system: docker
  dockerfile_path: "./Dockerfile"
  min_cpu: 0.5
  max_cpu: 2
  min_memory: 1024
  max_memory: 4096

# The binary and frontend/dist are produced by the Dockerfile.
start_command: "bash start.sh"

scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 256
  max_memory: 1024

health_check:
  type: http
  http_path: "/"
  interval_in_seconds: 30
